name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # A release so publica se os testes passarem.
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Checagem de tipos
        run: npx tsc --noEmit
      - name: Testes
        run: npm test

  release:
    needs: testes
    permissions:
      contents: write
    runs-on: windows-latest

    env:
      VITE_API_BASE_URL: https://ninx-api.maataug.com.br
      VITE_SIGNATURE_BASE_URL: https://ninx-assinatura.maataug.com.br

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # A tag é a única fonte da versão: v1.2.3 vira "version": "1.2.3" no package.json,
      # que o tauri.conf.json lê. Não é preciso editar versão à mão antes de criar a tag.
      - name: Definir versao a partir da tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Ninx ${{ github.ref_name }}"
          releaseBody: "Veja o changelog para detalhes desta versão."
          releaseDraft: false
          prerelease: false
