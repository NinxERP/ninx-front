name: CI

on:
  push:
    branches: [main, dsv]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: os testes usam TypeScript nativo do Node (node --test em arquivos .ts).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Checagem de tipos
        run: npx tsc --noEmit
      - name: Testes
        run: npm test
